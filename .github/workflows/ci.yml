name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || 'https://nanoka.tv' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Save deployable static files
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save browser diagnostics if checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
